<ion-content class="ion-padding">

  <!-- Siguiente cita -->
  <div *ngIf="siguienteCita">
    <h2 class="section-title">Hurrengo hitzordua</h2>

    <ion-card>
      <ion-card-content>
        <div class="date-badge">
          {{ siguienteCita.comment }}
        </div>

        <ion-text color="primary">
          <h1>{{ siguienteCita.start_time }}</h1>
        </ion-text>

        <p>{{ siguienteCita.date }}</p>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Histórico -->
  <div *ngIf="citas?.length > 1">
    <h2 class="section-title">Historikoa</h2>

    <ion-list>
      <ion-item *ngFor="let cita of citas.slice(1)">
        <ion-label>
          <h3>{{ cita.comment }}</h3>

          <p>{{cita.start_time}}  ||  {{ cita.date }}</p>
        </ion-label>
        <ion-note slot="end">
          {{ cita.status }}
        </ion-note>
      </ion-item>
    </ion-list>
  </div>

  <ion-button expand="block" (click)="z()">
      Zerbitzuak
    </ion-button>

</ion-content>
