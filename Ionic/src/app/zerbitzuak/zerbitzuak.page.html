<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Zerbitzuak</ion-title>
    
    <ion-buttons slot="end">
      <ion-button (click)="theme.toggleTheme()">
        <ion-icon slot="icon-only" [name]="theme.isDarkMode ? 'sunny' : 'moon'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list *ngIf="services && services.length > 0; else noServices">
    <ion-item *ngFor="let service of services">
      <ion-label>
        <h2>{{ service.name }}</h2>
        <p>Iraupena: {{ service.duration }} min</p>
        <p>Prezioa: €{{ service.price }}</p>
        <p>Base prezioa: €{{ service.home_price }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ng-template #noServices>
    <p>No hay servicios disponibles.</p>
  </ng-template>

</ion-content>
