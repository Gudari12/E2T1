<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Ongi Etorri</ion-title>
    
    <ion-buttons slot="end">
      <ion-button (click)="theme.toggleTheme()">
        <ion-icon slot="icon-only" [name]="theme.isDarkMode ? 'sunny' : 'moon'"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div id="container">
    
    <img src="assets/icon/fp.png">

    <ion-list lines="inset">
      <ion-item>
        <ion-input label="Erabiltzailea" label-placement="floating" [(ngModel)]="erabiltzailea"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Password" type="password" label-placement="floating" [(ngModel)]="password"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" (click)="login()">
      Login
    </ion-button>
    
  </div>
</ion-content>
